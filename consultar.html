<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultar pré-inscrição | ITMPA</title>
<meta name="description" content="Consulte o estado da sua pré-inscrição no Instituto Técnico Médio Profissional AQSA (ITMPA).">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.consulta{max-width:520px;margin:0 auto;background:#fff;color:#12263a;border:1px solid #cfd9e3;border-radius:12px;padding:24px 20px;font-family:"Nunito Sans",system-ui,sans-serif;font-size:17px;line-height:1.55}
.consulta h1{font-family:Bitter,Georgia,serif;font-size:1.6rem;line-height:1.2;margin:0;color:#0b3c5d;text-align:center}
.consulta .lg{display:block;margin:0 auto 12px;width:84px;height:auto}
.consulta .sub{color:#58697c;margin:8px 0 20px;text-align:center}
.consulta label{display:block;font-weight:700;margin:16px 0 6px}
.consulta input{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #cfd9e3;border-radius:6px;background:#fff;color:#12263a}
.consulta input:focus-visible,.consulta button:focus-visible{outline:3px solid #0b3c5d;outline-offset:2px}
.consulta button{width:100%;margin-top:22px;padding:14px;font:700 1.05rem "Nunito Sans",sans-serif;background:#0b3c5d;color:#fff;border:0;border-radius:6px;cursor:pointer}
.consulta button:disabled{opacity:.6;cursor:wait}
.consulta #erro{color:#b3261e;font-weight:700;margin:14px 0 0}
.consulta .res{margin-top:26px;border:1px solid #cfd9e3;border-radius:6px;background:#fff}
.consulta .topo{padding:22px 20px 26px}
  .consulta .topo{background:#fff;color:#12263a;position:static;box-shadow:none;border:0}
.consulta .topo h2{font-family:Bitter,Georgia,serif;font-size:1.2rem;line-height:1.2;margin:0 0 12px;color:#12263a}
.consulta .pill{display:inline-block;margin:0;padding:8px 14px;border-radius:999px;font-weight:700}
.consulta .amar{background:#fff0b8;color:#5c4500}.consulta .lar{background:#ffd9b0;color:#6a3200}
.consulta .verde{background:#c9efd2;color:#0f4a22}.consulta .azul{background:#cfe6ff;color:#0b3a6b}
.consulta .msg{margin:14px 0 0}
.consulta .corte{position:relative;border-top:2px dashed #cfd9e3}
.consulta .corte::before,.consulta .corte::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid #cfd9e3}
.consulta .corte::before{left:-11px}.consulta .corte::after{right:-11px}
.consulta dl{margin:0;padding:22px 20px 8px;display:grid;gap:14px}
.consulta dt{font-size:.85rem;color:#58697c}
.consulta dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.consulta .ajuda{margin:0;padding:6px 20px 22px;color:#58697c;font-size:.95rem}
</style>
</head>
<body data-pagina="consultar">
<header id="topo"></header>
<main>
<section class="bloco"><div class="wrap">
  <div class="consulta">
    <img class="lg" src="logo.jpg" alt="Logótipo do ITMPA">
    <h1>Consultar pré-inscrição</h1>
    <p class="sub">Escreva o código que recebeu ao enviar a ficha e o telefone que indicou na pré-inscrição.</p>

    <form id="f" novalidate>
      <label for="ref">Código da pré-inscrição</label>
      <input id="ref" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="Código recebido" required>
      <label for="tel">Telefone</label>
      <input id="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="84 123 4567" required>
      <button id="btn" type="submit">Consultar</button>
      <p id="erro" role="alert" hidden></p>
    </form>

    <section id="res" class="res" hidden aria-live="polite">
      <div class="topo">
        <h2>Pré-inscrição encontrada</h2>
        <p id="estado" class="pill"></p>
        <p id="msg" class="msg"></p>
      </div>
      <div class="corte"></div>
      <dl id="dl"></dl>
      <p class="ajuda">Guarde o código. Pode consultar esta página sempre que quiser.</p>
    </section>
  </div>
</div></section>
</main>
<div id="rodape"></div>
<script src="script.js"></script>
<script>
//const API = "https://script.google.com/macros/s/AKfycbz9XrkTzXniezFlEDnHCZWf7lKcHIQFERD9axQkmBEcepwOGrPGeoLUYDz7USoONUzV/exec";
  //const API = "https://script.google.com/macros/s/AKfycbz9XrkTzXniezFlEDnHCZWf7lKcHIQFERD9axQkmBEcepwOGrPGeoLUYDz7USoONUzV/exec";
  const API = "https://script.google.com/macros/s/AKfycbz9XrkTzXniezFlEDnHCZWf7lKcHIQFERD9axQkmBEcepwOGrPGeoLUYDz7USoONUzV/exec";
  

const $ = id => document.getElementById(id);
//const CAMPOS = [["Referência","ref"],["Nome","nome"],["Curso (1.ª opção)","curso1"],["Curso (2.ª opção)","curso2"],["Período","periodo"],["Telefone","tel"],["Data de envio","data"]];
  const CAMPOS = [["Referência","ref"],["Nome","nome"],["Curso 1","curso1"],["Curso 2","curso2"],["Curso 2ª opção","curso3"],["Período","periodo"],["Telefone","tel"],["Data de envio","data"]];
const ICONE = {amar:"🟡", lar:"🟠", verde:"🟢", azul:"🔵"};

function classeEstado(t){
  t = t.toLowerCase();
  if (t.includes("falta")) return "lar";
  if (t.includes("confirmada")) return "azul";
  if (t.includes("validada")) return "verde";
  return "amar";
}
function erro(t){ const e = $("erro"); e.textContent = t; e.hidden = !t; }

function mostrar(f){
  const dl = $("dl"); dl.replaceChildren();
  CAMPOS.forEach(([rotulo, k]) => {
    if (!f[k]) return;
    const dt = document.createElement("dt"); dt.textContent = rotulo;
    const dd = document.createElement("dd"); dd.textContent = f[k];
    dl.append(dt, dd);
  });
  const estado = f.estado || "Pendente", c = classeEstado(estado), p = $("estado");
  p.className = "pill " + c;
  p.textContent = ICONE[c] + " " + estado;
  $("msg").textContent = f.mensagem || "";
  $("res").hidden = false;
  $("res").scrollIntoView({behavior: "smooth", block: "start"});
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  erro(""); $("res").hidden = true;
  const ref = $("ref").value.trim(), tel = $("tel").value.trim();
  if (ref.length < 4 || tel.replace(/\D/g, "").length < 9) return erro("Preencha o código e o telefone completo.");
  const b = $("btn"); b.disabled = true; b.textContent = "A consultar…";
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(API, {method: "POST", body: JSON.stringify({acao: "consultar", ref, tel}), signal: ctl.signal});
    const j = await r.json();
    if (j.ok) mostrar(j.ficha); else erro(j.erro || "Não foi possível consultar. Tente novamente.");
  } catch (x) {
    erro("Sem ligação ou o serviço demorou demasiado. Tente novamente.");
  } finally {
    clearTimeout(t); b.disabled = false; b.textContent = "Consultar";
  }
});
</script>
</body>
</html>
